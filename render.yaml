services:
  - type: web
    name: collaborative-drawing-canvas-backend
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: MAX_PAYLOAD_BYTES
        value: 131072
